[package]
name = "fractal_rndr"
version = "0.2.4"
description = "A fractal renderer that features several coloring modes, anti-aliasing and a gui."
keywords = ["fractal", "renderer", "anti-aliasing"]
homepage = "https://gitlab.com/valflrt/fractal_rndr"
authors = ["valflrt"]
edition = "2021"
license = "MIT"

[dependencies]
eframe = { version = "0.32.1", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui_extras = { version = "0.32.1", default-features = false, features = ["image"] }
fastrand = "2.3.0"
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg"] }
rayon = "1.11.0"
rfd = "0.15.4"
ron = "0.10.1"
serde = { version = "1.0.219", features = ["derive"] }
valargs = "0.1.7"
wide = "0.7.33"

[features]
default = []
force_f32 = []
