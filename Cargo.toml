[package]
name = "fractal_rndr"
version = "0.2.7"
description = "A fractal renderer with a simple gui and with anti-aliasing."
keywords = ["fractal", "renderer", "anti-aliasing"]
homepage = "https://gitlab.com/valflrt/fractal_rndr"
authors = ["valflrt"]
edition = "2024"
license = "MIT"

[dependencies]
eframe = "0.34.0"
egui_extras = { version = "0.34.0", default-features = false, features = ["image"] }
fastrand = "2.4.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rayon = "1.12.0"
rfd = "0.17.2"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
valargs = "0.1.9"
wide = "1.3.0"

[features]
default = []
force_f32 = []
